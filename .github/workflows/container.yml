name: Publish container

on:
  schedule:
    - cron: '30 2 * * *' # nightly: rebuild with the latest provider versions
  push:
    branches: [main]
    paths: &container-paths
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'index.html'
      - 'vite.config.*'
      - 'tsconfig*.json'
      - 'Dockerfile'
      - 'nginx.conf'
      - '.dockerignore'
      - '.github/workflows/container.yml'
  pull_request:
    paths: *container-paths
  workflow_dispatch:
    inputs:
      retention_dry_run:
        description: 'Only preview retention (no build, push or deletion)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: container-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    if: github.event_name == 'pull_request' || (github.ref == 'refs/heads/main' && !inputs.retention_dry_run)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -- scripts/container-retention.test.mjs
      - run: npm run lint
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value={{date 'YYYYMMDD'}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.description=Firewall Forge: unofficial, community-driven firewall rule generator (static site)
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          # no-cache so the nightly build really re-fetches provider versions
          no-cache: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  retention:
    needs: image
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      (needs.image.result == 'success' ||
       (github.event_name == 'workflow_dispatch' && inputs.retention_dry_run))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test -- scripts/container-retention.test.mjs
      - name: Resolve package owner type
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          owner_type=$(gh api users/${{ github.repository_owner }} --jq .type)
          echo "PACKAGE_OWNER_TYPE=$owner_type" >> "$GITHUB_ENV"
      - name: Retain 30 days of dated and SHA container versions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RETENTION_DRY_RUN: ${{ inputs.retention_dry_run || false }}
        run: |
          if [ "$RETENTION_DRY_RUN" = true ]; then
            node scripts/container-retention.mjs
          else
            node scripts/container-retention.mjs --apply
          fi
